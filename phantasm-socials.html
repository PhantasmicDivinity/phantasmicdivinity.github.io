<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know more about Phantasm</title>
    <link rel="icon" type="image/jpg" href="Terror-of-doom.jpg">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --hover-bg: #21262d;
        }

        body {
            font-family:"Segoe UI", Lucida, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px; 
            text-align: center;
        }

        .top-heading {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 32px;
            color: #f0f6fc;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 64px;
            text-align: left;
        }

        .section-title, .section-title2 {
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 0 0 16px 0;
            color: #8b949e;
            border-bottom: 1px solid #21262d;
            padding-bottom: 6px;
        }

        .column-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card, .info-card {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--card-bg);
            color: var(--text-color);
            padding: 16px;
            border-radius: 8px;
            font-weight: 500;
            border: 1px solid #30363d;
            box-sizing: border-box;
        }

        .card {
            text-decoration: none;
            transition: all 0.2s ease-in-out;
        }

        .card:hover {
            background-color: var(--hover-bg);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .info-card {
            cursor: default;
            flex-direction: column;
            gap: 4px;
            padding: 14px;
        }

        .card-title {
            font-weight: 600;
            font-size: 1.05rem;
            color: #f0f6fc;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #8b949e;
            font-weight: 400;
        }

        @media (max-width: 600px) {
            .content-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-heading">Phantasm's Socials</div>

        <div class="content-grid">
            
            <div>
                <div class="section-title">Connect</div>
                <div class="column-container">
                    <a href="https://discord.com" target="_blank" class="card">Discord</a>
                    <a href="https://reddit.com" target="_blank" class="card">Reddit</a>
                    <a href="https://youtube.com" target="_blank" class="card">Youtube</a>
                    <a href="https://tiktok.com" target="_blank" class="card">Tiktok</a>
                    <a href="https://x.com" target="_blank" class="card">X</a>
                </div>
            </div>

            <div>
                <div class="section-title2">Gaming</div>
                <div class="column-container">
                    <a href="https://steamcommunity.com" class="card" target="_blank">Steam</a>
                    <a href="https://roblox.com" class="card" target="_blank">Roblox</a>
                    <div class="info-card">
                        <span class="card-title">Geometry Dash</span>
                        <span class="card-desc">Username: FireszGD</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
